# Conda environment for the project. Equivalent pip-only setup:
#   python3.11 -m venv .venv && . .venv/bin/activate && pip install -r requirements.txt
# On a CUDA machine, install the matching torch build first if pip picks the wrong one.
name: lsbfd
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - aria2        # parallel PU download
  - p7zip        # PU .rar extraction (7z)
  - pip:
      - -r requirements.txt
